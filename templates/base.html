<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Книжковий Трекер{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #1f2937; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: bold; color: #38bdf8; text-decoration: none; }
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; align-items: center; }
        nav a { color: #f3f4f6; text-decoration: none; font-size: 16px; font-weight: 500; }
        nav a:hover { color: #38bdf8; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; box-sizing: border-box; }
        footer { background-color: #111827; color: #9ca3af; padding: 30px 40px; margin-top: auto; }
        .footer-content { display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">📚 BookTracker</a>
        <nav>
            <ul>
                <li><a href="/">Головна</a></li>
                <li style="position:relative;">
                    <span style="cursor:pointer; color:#f3f4f6;">Жанри ▼</span>
                    <div style="position:absolute; background: white; border: 1px solid #ccc; padding: 10px; display:none; flex-direction:column; gap:8px; width:180px; z-index:100; border-radius:5px; margin-top:5px;" id="dropdown">
                        {% for cat in categories %}
                            <a href="/category/{{ cat.id }}/" style="color:#333; text-decoration:none; font-size:14px;">{{ cat.name }}</a>
                        {% endfor %}
                    </div>
                </li>
                <li><a href="/about/">Про нас</a></li>
                <li><a href="/contacts/">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <div class="footer-content">
            <div><h4>BookTracker</h4><p>Лабораторна робота №6</p></div>
            <div><p><a href="/" style="color:#9ca3af;">На головну</a></p></div>
        </div>
    </footer>

    <script>
        // Скрипт для показу жанрів при наведенні
        const parent = document.querySelector('nav li:nth-child(2)');
        const dropdown = document.getElementById('dropdown');
        parent.addEventListener('mouseenter', () => dropdown.style.display = 'flex');
        parent.parentElement.addEventListener('mouseleave', () => dropdown.style.display = 'none');
    </script>
</body>
</html>
