{% extends 'base.html' %}

{% block content %}
    <h1 style="color: #111827;">Всі книги нашої платформи</h1>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 20px;">
        {% for book in books %}
            <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; display:flex; flex-direction:column; justify-content:space-between;">
                <div>
                    {% if book.image %}
                        <img src="{{ book.image.url }}" style="width:100%; height:250px; object-fit:cover; border-radius:5px; margin-bottom:15px;" alt="">
                    {% else %}
                        <div style="width:100%; height:250px; background:#e5e7eb; border-radius:5px; margin-bottom:15px; display:flex; align-items:center; justify-content:center; color:#9ca3af;">Немає обкладинки</div>
                    {% endif %}
                    <h3 style="margin: 0 0 5px 0;"><a href="/book/{{ book.id }}/" style="color:#111827; text-decoration:none;">{{ book.title }}</a></h3>
                    <p style="margin:0 0 10px 0; color:#6b7280; font-style:italic;">Автор: {{ book.author }}</p>
                    <span style="background:#e0f2fe; color:#0369a1; padding:3px 8px; border-radius:12px; font-size:12px;">{{ book.category.name }}</span>
                </div>
                <button class="btn-buy" disabled>Додати в читане (Недоступно)</button>
            </div>
        {% endfor %}
    </div>
{% endblock %}
