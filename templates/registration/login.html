{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; border: 1px solid #e5e7eb;">
    <h2>Вхід до акаунту</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background:#0284c7; color:white; border:none; padding:10px 20px; border-radius:5px; width:100%; font-weight:bold; cursor:pointer;">Увійти</button>
    </form>
    <p style="margin-top:15px; text-align:center;"><a href="{% url 'password_reset' %}" style="color:#6b7280;">Забули пароль? Відновити</a></p>
</div>
{% endblock %}
