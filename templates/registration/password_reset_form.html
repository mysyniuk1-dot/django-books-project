{% extends 'base.html' %}
{% block content %}
<div style="max-width:400px; margin:40px auto; background:white; padding:30px; border-radius:8px; border:1px solid #e5e7eb;">
    <h2>Відновлення пароля</h2>
    <p style="font-size:14px; color:#6b7280;">Введіть ваш Email, і ми надішлемо вам тимчасове посилання для створення нового пароля.</p>
    <form method="POST">
        {% csrf_token %}
        <p><input type="email" name="email" required placeholder="Ваш Email..." style="padding:10px; border-radius:5px; width:100%; border:1px solid #ccc; box-sizing:border-box;"></p>
        <button type="submit" style="background:#0284c7; color:white; border:none; padding:10px 20px; border-radius:5px; width:100%; font-weight:bold; cursor:pointer;">Надіслати код</button>
    </form>
</div>
{% endblock %}
