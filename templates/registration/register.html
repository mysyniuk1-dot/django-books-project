{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; border: 1px solid #e5e7eb;">
    <h2>Реєстрація нового користувача</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background:#28a745; color:white; border:none; padding:10px 20px; border-radius:5px; width:100%; font-weight:bold; cursor:pointer;">Зареєструватися</button>
    </form>
</div>
{% endblock %}
